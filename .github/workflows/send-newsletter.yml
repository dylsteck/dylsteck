name: Send Newsletter

on:
  pull_request:
    types: [closed]

jobs:
  send:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'newsletter')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get new blog posts from PR
        id: posts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | select(.status=="added") | select(.filename | test("^app/blog/posts/.*\\.md$")) | .filename')
          if [ -z "$FILES" ]; then
            echo "No new blog posts in this PR"
            echo "slugs=" >> $GITHUB_OUTPUT
            exit 0
          fi
          SLUGS=$(echo "$FILES" | sed 's|app/blog/posts/||' | sed 's|\.md$||' | tr '\n' ' ')
          echo "slugs=$SLUGS" >> $GITHUB_OUTPUT
          echo "Found new posts: $SLUGS"

      - name: Send newsletter for each new post
        if: steps.posts.outputs.slugs != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          SLUGS: ${{ steps.posts.outputs.slugs }}
        run: |
          for slug in $SLUGS; do
            if [ -n "$slug" ]; then
              echo "Sending newsletter for: $slug"
              bun run scripts/send-newsletter.ts "$slug"
            fi
          done
